<!doctype html><html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}#zone{position:absolute;overflow:hidden}
.label,.chip{white-space:nowrap;font-weight:var(--weight);color:var(--fg);line-height:1.2;paint-order:stroke fill;-webkit-text-stroke-color:var(--stroke-color)}
.label{position:absolute}.panel{position:absolute;overflow:hidden;border:2px solid var(--accent);border-radius:12px;background:#131923e8}
.chip{position:absolute;display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);border-radius:9px;background:#131923f2;padding:6px}
.line{position:absolute;background:var(--accent);transform-origin:left center}img{display:block;position:absolute;width:100%;height:100%;object-fit:contain}
.target{position:absolute;border:3px solid var(--accent);background:transparent;pointer-events:none}
</style></head><body><div id="stage"><div id="zone"></div></div><script>
const D=__SCENE_DATA__,p=D.params,z=document.getElementById('zone'),r=p.zone;
const W=D.width*r[2],H=D.height*r[3],N=D.frames;
Object.assign(z.style,{left:r[0]*100+'%',top:r[1]*100+'%',width:W+'px',height:H+'px'});
document.documentElement.style.setProperty('--accent',p.accent||D.accent);
document.documentElement.style.setProperty('--fg',D.foreground);
document.documentElement.style.setProperty('--weight',D.font.weight);
document.documentElement.style.setProperty('--stroke-color',p.stroke_color||'#000000');
const face=new FontFace('ProjectCJK',`url("${D.font.url}")`,{weight:String(D.font.weight)});
window.ready=face.load().then(f=>{document.fonts.add(f);document.body.style.fontFamily='ProjectCJK';return document.fonts.ready});
const clamp=x=>Math.max(0,Math.min(1,x)),ease=x=>1-Math.pow(1-clamp(x),3);
const prog=(f,a,b)=>clamp((f-a)/Math.max(1e-9,b-a));
const event=(key,fallback)=>p[key]===undefined?fallback:D.events[p[key]];
const times=(key,fallback)=>p[key]===undefined?fallback:p[key].map(id=>D.events[id]);
const add=(cls,text,parent=z)=>{const e=document.createElement('div');e.className=cls;if(text!==undefined)e.textContent=text;parent.append(e);return e};
const style=(e,v)=>Object.assign(e.style,v);
const pic=(key,parent=z)=>{const e=document.createElement('img');e.src=D.assets[key];e.style.objectFit=p.image_fit||'contain';parent.append(e);return e};
const type=(e,size)=>{style(e,{fontSize:size+'px',webkitTextStrokeWidth:(p.stroke_width??Math.max(.8,size*.045))+'px'})};
const label=(text,x,y,size,width=W-x,parent=z)=>{const e=add('label',text,parent);style(e,{left:x+'px',top:y+'px',width:width+'px'});type(e,size);return e};
const chip=(text,x,y,w,h,parent=z)=>{const e=add('chip',text,parent);style(e,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});type(e,p.font_size||Math.min(h*.38,w*.16));return e};
const enter=p.enter_frames??Math.max(1,Math.round(D.fps*.2));let draw;
if(D.recipe==='impact-title'){
 const title=label(p.title,W*.1,H*.27,p.font_size||H*.4,W*.8);style(title,{textAlign:'center',transformOrigin:'50% 50%'});
 const rail=add('line');style(rail,{left:'8%',top:'85%',width:'84%',height:'5px'});
 const end=event('reveal_event',enter),start=Math.max(0,end-enter);
 draw=f=>{const a=ease(prog(f,start,end));title.style.transform=`scale(${1.2-.2*a}) rotate(${(-2+2*a)}deg)`;rail.style.transform=`scaleX(${.12+.88*a})`};
}else if(D.recipe==='evidence-focus'){
 const box=add('panel');style(box,{left:0,top:'22%',width:'100%',height:'78%'});const image=pic('image',box);
 style(image,{transformOrigin:`${p.focus_x*100}% ${p.focus_y*100}%`});const title=label(p.title,W*.02,0,p.font_size||H*.13,W*.96);
 const [a,b]=times('focus_events',[0,Math.max(1,N*.45)]);
 draw=f=>{const q=ease(prog(f,a,b));image.style.transform=`scale(${1+(p.zoom-1)*q})`;title.style.transform=`translateX(${(1-q)*-W*.01}px)`};
}else if(D.recipe==='before-after'){
 const base=add('panel');style(base,{left:0,top:'20%',width:'100%',height:'80%'});pic('before',base);
 const reveal=add('',undefined,base);style(reveal,{position:'absolute',inset:0});pic('after',reveal);
 const divider=add('line',undefined,base);style(divider,{top:0,height:'100%',width:'4px'});
 label(p.before_label,W*.02,0,p.font_size||H*.11,W*.45);const right=label(p.after_label,W*.53,0,p.font_size||H*.11,W*.45);right.style.textAlign='right';
 const [a,b]=times('reveal_events',[0,Math.max(1,N*.55)]);
 draw=f=>{const q=ease(prog(f,a,b)),split=.1+.8*q;reveal.style.clipPath=`inset(0 ${(1-split)*100}% 0 0)`;divider.style.left=split*100+'%'};
}else if(D.recipe==='object-converge'){
 const items=p.items.map((v,i)=>{const a=2*Math.PI*i/p.items.length-Math.PI/2;return {e:chip(v,0,0,W*.28,H*.19),x:W*.36+Math.cos(a)*W*.3,y:H*.4+Math.sin(a)*H*.3}});
 const result=chip(p.result,W*.18,H*.37,W*.64,H*.26),[a,b]=times('merge_events',[0,Math.max(1,N*.55)]);
 draw=f=>{const q=ease(prog(f,a,b));for(const item of items){style(item.e,{left:(item.x*(1-q)+W*.36*q)+'px',top:(item.y*(1-q)+H*.4*q)+'px',opacity:String(1-clamp((q-.65)/.35))})}result.style.opacity=String(clamp((q-.65)/.35));result.style.transform=`scale(${.85+.15*q})`};
}else if(D.recipe==='process-flow'){
 const n=p.steps.length,vertical=W<H,w=vertical?W*.8:W*.94/(n*1.25),h=vertical?H*.94/(n*1.35):Math.min(H*.5,w*.7);
 const gap=(vertical?H*.94-n*h:W*.94-n*w)/(n-1),items=p.steps.map((v,i)=>chip(v,vertical?W*.1:W*.03+i*(w+gap),vertical?H*.03+i*(h+gap):(H-h)/2,w,h));
 const bars=p.steps.slice(1).map((_,i)=>{const e=add('line');style(e,vertical?{left:W*.5+'px',top:H*.03+i*(h+gap)+h+'px',width:'3px',height:gap+'px',transformOrigin:'center top'}:{left:W*.03+i*(w+gap)+w+'px',top:H/2+'px',width:gap+'px',height:'3px'});return e});
 const t=times('step_events',p.steps.map((_,i)=>i*Math.max(1,N*.8)/(n-1)));
 draw=f=>{let current=-1;t.forEach((at,i)=>{if(f>=at)current=i});items.forEach((e,i)=>{e.dataset.active=String(i<=current);e.style.background=i<=current?'#284052':'#131923f2';e.style.transform=`scale(${i===current?1.025:1})`});bars.forEach((e,i)=>e.style.transform=`${vertical?'scaleY':'scaleX'}(${prog(f,t[i],t[i+1])})`)};
}else if(D.recipe==='thesis-proof'){
 const title=label(p.title,W*.02,0,p.font_size||H*.15,W*.96);const box=add('panel');style(box,{left:'20%',top:'32%',width:'80%',height:'68%'});pic('image',box);
 const proof=label(p.proof_label,W*.02,H*.2,p.proof_font_size||H*.09,W*.96);const line=add('line');style(line,{left:'2%',top:'46%',width:'16%',height:'4px'});
 const end=event('reveal_event',enter);
 draw=f=>{const q=ease(prog(f,Math.max(0,end-enter),end));box.style.transform=`translateY(${(1-q)*H*.03}px)`;line.style.transform=`scaleX(${q})`;proof.style.opacity=String(.5+.5*q)};
}else if(D.recipe==='source-conclusions'){
 const g=D.geometry,vertical=W<H,n=p.conclusions.length;
 const bw=vertical?W:W*.46,bh=vertical?H*.45:H,box=add('panel');style(box,{left:0,top:0,width:bw+'px',height:bh+'px'});pic('image',box);
 const fit=Math.min((bw-4)/g.width,(bh-4)/g.height),ox=(bw-g.width*fit)/2,oy=(bh-g.height*fit)/2,mark=add('target',undefined,box);
 const left=vertical?W*.02:W*.5,top=vertical?H*.5:0,cw=vertical?W*.96:W*.5,ch=vertical?H*.5:H,gap=ch*.035,h=(ch-gap*(n-1))/n;
 const cards=p.conclusions.map((v,i)=>chip(v,left,top+i*(h+gap),cw,h));const t=times('conclusion_events',[]);
 draw=f=>{let current=-1;cards.forEach((e,i)=>{e.style.opacity=f>=t[i]?'1':'0';if(f>=t[i])current=i});mark.style.opacity=current<0?'0':'1';if(current>=0){const [x,y,w,h]=g.targets[p.target_ids[current]];style(mark,{left:ox+x*fit+'px',top:oy+y*fit+'px',width:w*fit+'px',height:h*fit+'px'})}};
}else if(D.recipe==='detail-overview'){
 const g=D.geometry,box=add('panel');style(box,{inset:0});const camera=add('',undefined,box);style(camera,{position:'absolute',inset:0,transformOrigin:'0 0'});
 const fit=Math.min((W-4)/g.width,(H-4)/g.height),iw=g.width*fit,ih=g.height*fit,ix=(W-iw)/2,iy=(H-ih)/2;
 const image=pic('image',camera);style(image,{left:ix+'px',top:iy+'px',width:iw+'px',height:ih+'px'});
 const [x,y,w,h]=g.targets[p.focus_target],mark=add('target',undefined,camera);style(mark,{left:ix+x*fit+'px',top:iy+y*fit+'px',width:w*fit+'px',height:h*fit+'px'});
 const zoom=p.zoom??Math.min(5,Math.max(1,W/(w*fit*1.3))),[a,b]=times('overview_events',[]);
 const center=(v,lo,hi,half)=>hi-lo<=half*2?(lo+hi)/2:Math.max(lo+half,Math.min(hi-half,v));
 draw=f=>{const q=ease(prog(f,a,b)),scale=zoom+(1-zoom)*q,cx=center(ix+(x+w/2)*fit,ix,ix+iw,W/(2*scale)),cy=center(iy+(y+h/2)*fit,iy,iy+ih,H/(2*scale));camera.style.transform=`translate(${W/2-scale*cx}px,${H/2-scale*cy}px) scale(${scale})`;mark.style.opacity=String(1-q)};
}else if(D.recipe==='path-converge'){
 const n=p.items.length,h=Math.min(H/(n+1)*.65,H*.18),sw=W*.35,rx=W*.64,ry=H*.4,rw=W*.34,rh=H*.2;
 const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('width',W);svg.setAttribute('height',H);style(svg,{position:'absolute',inset:0});z.append(svg);
 const end={x:rx+rw/2,y:ry+rh/2};
 const items=p.items.map((v,i)=>{const sy=(i+.5)*H/n-h/2,start={x:sw/2,y:sy+h/2},control={x:W*.56,y:start.y};const path=document.createElementNS(svg.namespaceURI,'path');path.setAttribute('d',`M${start.x},${start.y} Q${control.x},${control.y} ${end.x},${end.y}`);path.setAttribute('fill','none');path.setAttribute('stroke',p.accent||D.accent);path.setAttribute('stroke-width','3');path.setAttribute('pathLength','1');path.setAttribute('stroke-dasharray','1');svg.append(path);return {e:chip(v,0,sy,sw,h),start,control,path}});
 const result=chip(p.result,rx,ry,rw,rh),[a,b]=times('merge_events',[]);
 draw=f=>{const q=prog(f,a,b),move=ease(prog(q,.25,.95));for(const item of items){const {start:s,control:c}=item,u=1-move,x=u*u*s.x+2*u*move*c.x+move*move*end.x,y=u*u*s.y+2*u*move*c.y+move*move*end.y;style(item.e,{left:x-sw/2+'px',top:y-h/2+'px',transform:`scale(${1-.9*move})`,opacity:String(1-prog(move,.85,1))});item.path.setAttribute('stroke-dashoffset',String(1-prog(q,0,.25)));item.path.style.opacity=String(1-prog(q,.9,1))}result.style.opacity=String(prog(q,.85,1));result.dataset.complete=String(f>=b)};
}else{throw Error('Unknown recipe '+D.recipe)}
let checked=false;
window.renderAt=fSeconds=>{
 draw(Math.max(0,Math.min(N-1,Math.round(fSeconds*D.fps))));
 if(!checked){
  const ctx=document.createElement('canvas').getContext('2d'),metrics=[];
  for(const e of z.querySelectorAll('.label,.chip')){
   const s=getComputedStyle(e);ctx.font=`${s.fontWeight} ${s.fontSize} ${s.fontFamily}`;
   const ink=ctx.measureText(e.textContent),stroke=parseFloat(s.webkitTextStrokeWidth),padding=parseFloat(s.paddingLeft)+parseFloat(s.paddingRight),available=e.clientWidth-padding-2*stroke;
   const box=e.getBoundingClientRect(),zone=z.getBoundingClientRect();
   if(ink.width>available+1||(parseFloat(s.fontSize)*1.2+2*stroke>e.clientHeight+1&&e.classList.contains('chip'))||box.top<zone.top-.5||box.bottom>zone.bottom+.5)throw Error('Text does not fit: enlarge zone, split or redesign '+e.textContent);
   metrics.push({text:e.textContent,font:s.fontFamily,weight:s.fontWeight,font_size:s.fontSize,stroke_width:stroke,text_width:ink.width,available_width:available});
  }
  if(D.geometry){const image=z.querySelector('img');if(image.naturalWidth!==D.geometry.width||image.naturalHeight!==D.geometry.height)throw Error('Measured image dimensions no longer match geometry')}
  window.layoutReport={font:D.font,metrics};checked=true;
 }
};
</script></body></html>
